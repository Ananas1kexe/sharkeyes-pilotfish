[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pilotfish"
version = "0.2.0"
description = "Privacy-first proxy that redacts PII before it reaches an LLM and restores it in the response."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = ["llm", "pii", "privacy", "redaction", "pseudonymization", "security"]
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "dotenv"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "endpoints", "repository", "assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
