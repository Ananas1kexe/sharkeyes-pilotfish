[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkeyes"
version = "0.1.0"
description = "Local PII/secret redaction and prompt-injection guard for LLM calls. Hebrew-aware. Zero dependencies, zero servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = ["pytest", "fastapi>=0.100", "httpx"]

[tool.setuptools.packages.find]
include = ["sharkeyes*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
